  <script>
    const uiStoreStr = localStorage.getItem('ui');
    let isDark = false;
    if (uiStoreStr) {
      try {
        const uiStore = JSON.parse(uiStoreStr);
        isDark = uiStore.dark;
        document.documentElement.setAttribute('class', isDark ? 'dark' : '');
      } catch (e) {}
    }
    const metaTag = document.getElementById('theme-color-meta');
    if (metaTag) {
      metaTag.setAttribute('content', isDark ? '#111215' : '#FAF8F5');
    }
  </script>
</head>
<style>
  html {
    background: #FAF8F5;
    font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .dark {
    background: #111215;
  }
  #loading-first {
    position: fixed;
    left: 0;
    top: 0;
    height: 100%;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 500;
    background: #FAF8F5;
  }
  .dark #loading-first {
    background: #111215;
  }

  .loading-hide {
    pointer-events: none;
    opacity: 0;
    transition: opacity 300ms ease;
  }

  .loading-icon {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .loading-image {
    width: 64px;
    height: 64px;
    object-fit: contain;
    filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.08));
  }

  .loading-progress {
    position: relative;
    width: 64px;
    height: 3px;
    overflow: hidden;
    border-radius: 999px;
    background: rgba(37, 99, 235, 0.15);
  }

  .loading-progress::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    border-radius: inherit;
    background: #3B82F6;
    transform: scaleX(0);
    transform-origin: left center;
    animation: loading-progress-grow 2.4s linear forwards;
  }

  .loading-progress::after {
    content: "";
    position: absolute;
    top: 0;
    width: 24px;
    height: 100%;
    border-radius: inherit;
    background: rgba(59, 130, 246, 0.5);
    filter: blur(4px);
    transform: translateX(-24px);
    animation: loading-progress-peg 2.4s linear forwards;
  }

  .loading-complete .loading-progress::before {
    animation: none;
    transform: scaleX(1);
    transition: transform 200ms linear;
  }

  .loading-complete .loading-progress::after {
    animation: none;
    transform: translateX(60px);
    transition: transform 200ms linear;
  }

  @keyframes loading-progress-grow {
    0% { transform: scaleX(0); }
    100% { transform: scaleX(1); }
  }

  @keyframes loading-progress-peg {
    0% { transform: translateX(-24px); }
    100% { transform: translateX(60px); }
  }
</style>
<body>
<div id="loading-first">
  <div class="loading-icon">
    <img class="loading-image" src="/mail.png" alt="GrabbyMail">
    <div class="loading-progress" aria-hidden="true"></div>
  </div>
</div>
<div id="app"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
