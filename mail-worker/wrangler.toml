name = "grabby-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

[[d1_databases]]
binding = "db"
database_name = "grabby_mail_db"
database_id = "5667936a-8433-4363-886b-d737ea383cdd"

[[kv_namespaces]]
binding = "kv"
id = "cb0b908c201e41bdb59a8ea21af61086"

[ai]
binding = "ai"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 * * * *"]

[vars]
domain = '["grabby.qzz.io"]'
default_reg_key = "FREESnowden"
admin_email = "admin@grabby.qzz.io"
title = "Grabby Mail"
