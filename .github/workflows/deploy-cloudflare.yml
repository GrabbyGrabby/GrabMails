name: 🚀 Deploy to Cloudflare Workers

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: 🏗️ Deploy to Cloudflare Workers
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 📦 Install Dependencies
        working-directory: ./mail-worker
        run: npm install --no-audit --no-fund

      - name: 🔍 Validate Worker Syntax, Schema & Unit Tests
        working-directory: ./mail-worker
        run: |
          node -c src/index.js
          npm run test:unit

      - name: 🚀 Deploy with Wrangler
        working-directory: ./mail-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "⚡ Deploying to Cloudflare Workers..."
            npx wrangler deploy
            echo "✅ Deployment completed successfully!"
          else
            echo "⚠️ CLOUDFLARE_API_TOKEN secret is not set in GitHub repository settings."
          fi
