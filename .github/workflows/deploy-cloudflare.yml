name: 🚀 Deploy GrabMails to Cloudflare Workers

on:
  push:
    branches: [ main ]
    paths:
      - "mail-worker/**"
  workflow_dispatch:

jobs:
  deploy:
    name: 🏗️ Deploy to Cloudflare Workers
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙ Set up pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: 11

      - name: ⚙ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: "./mail-worker/pnpm-lock.yaml"

      - name: 📦 Install Dependencies
        working-directory: ./mail-worker
        run: pnpm install --frozen-lockfile

      - name: 🚀 Deploy with Wrangler
        working-directory: ./mail-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            pnpm wrangler deploy
          else
            echo "ℹ️ CLOUDFLARE_API_TOKEN secret not configured in GitHub repository secrets. Skipping remote worker deploy."
          fi
