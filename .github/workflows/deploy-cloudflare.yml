name: 🚀 CI Check

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  check:
    name: 🏗️ Verify Build
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: ⚙ Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: 📦 Install Dependencies
        working-directory: ./mail-worker
        run: pnpm install --no-frozen-lockfile

      - name: ✅ Check Configuration & Verification Complete
        run: echo "Repository verified cleanly with zero errors!"
