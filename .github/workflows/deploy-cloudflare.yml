name: Build, verify and deploy Cloudflare Worker

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - name: Install locked frontend and Worker dependencies
        run: |
          pnpm --dir mail-vue install --frozen-lockfile
          pnpm --dir mail-worker install --frozen-lockfile
      - name: Run unit tests
        working-directory: mail-worker
        run: pnpm run test:unit
      - name: Build current sources and verify the deployment bundle
        working-directory: mail-worker
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          pnpm exec wrangler deploy --dry-run --outdir .wrangler/deploy-check
          node --test test/deployment/*.test.mjs
          MCP_WORKER_BUNDLE=.wrangler/deploy-check/index.js node --test test/mcp-authorization.test.mjs
      - name: Deploy with Wrangler
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: mail-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'Cloudflare deployment requires CLOUDFLARE_API_TOKEN.' >&2
            exit 1
          fi
          pnpm exec wrangler deploy
