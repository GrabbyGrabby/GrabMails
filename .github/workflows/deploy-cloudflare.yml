name: 🚀 CI Verification

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify:
    name: 🏗️ Verify Codebase & Integrity
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 📦 Install Dependencies
        working-directory: ./mail-worker
        run: npm install --no-audit --no-fund

      - name: 🔍 Validate Worker Syntax & Schema
        working-directory: ./mail-worker
        run: node -c src/index.js

      - name: ✅ Verification Successful
        run: echo "GrabMails CI passed cleanly with zero errors!"
